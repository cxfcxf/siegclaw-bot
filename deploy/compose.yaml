# Runs the published image — no source checkout needed.
#
#   mkdir siegclaw-bot && cd siegclaw-bot      # any folder; data lives beside this file
#   curl -O https://raw.githubusercontent.com/cxfcxf/siegclaw-bot/main/deploy/compose.yaml
#   docker compose up -d
#
# To update to the newest image:
#
#   docker compose pull && docker compose up -d
#
# To pin a version (roll back), replace `latest` with a commit sha tag.

services:
  siegclaw-bot:
    image: ghcr.io/cxfcxf/siegclaw-bot:latest
    container_name: siegclaw-bot
    ports:
      - "8800:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # All state is in these four folders; the image holds only code.
    volumes:
      - ./wiki:/app/wiki
      - ./wiki-public:/app/wiki-public
      - ./data:/app/data
      - ./workspace:/app/workspace
    restart: unless-stopped
