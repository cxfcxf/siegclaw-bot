[project]
name = "siegclaw-bot"
version = "0.1.0"
description = "Self-hosted agentic assistant: web UI + Discord bot, with tools, MCP, skills, and mem0 memory"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "openai>=1.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "python-multipart>=0.0.9",
    # Discord bot (runs in the same process as the web UI).
    "discord.py>=2.3,<3",
    # Memory is a separate mem0 REST service — talked to over HTTP (no in-process
    # torch/chromadb). Install mem0ai/chromadb/sentence-transformers only if you
    # run the in-process Mem0Backend instead of MEM0_API_URL.
]

[tool.setuptools]
packages = ["app", "app.tools"]
