# OrbStack injects an HTTP proxy into containers whose NO_PROXY doesn't cover
# compose service names or the 192.168.1.x LAN, which 502s all internal/LAN HTTP.
# Disable the proxy inside our containers so they use Docker DNS + direct routing.
x-noproxy: &noproxy
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  NO_PROXY: "*"
  no_proxy: "*"

services:
  siegclaw-bot:
    build: .
    # Host 8800 -> container 8080.
    ports:
      - "8800:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No env_file: configuration lives in data/settings.db and is edited in the
    # web UI (sidebar -> Settings). Only paths and the proxy opt-out are passed
    # through the environment; everything else is stored.
    environment:
      <<: *noproxy
    # Only mount runtime data; app code comes from the image. Rebuild to change code.
    # wiki/ is the LLM-Wiki — the assistant's entire durable knowledge (system
    # prompt, memory, lessons) as markdown pages. A directory mount, so edits
    # from either side (host editor or the model itself) apply immediately.
    # wiki-public/ is the separate Discord-channel wiki: channel mentions read
    # and write only that one, and never see wiki/ (see app/wiki.py).
    volumes:
      - ./wiki:/app/wiki
      - ./wiki-public:/app/wiki-public
      - ./data:/app/data
      - ./workspace:/app/workspace
    restart: unless-stopped
