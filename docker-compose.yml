# OrbStack injects an HTTP proxy into containers whose NO_PROXY doesn't cover
# compose service names or the 192.168.1.x LAN, which 502s all internal/LAN HTTP.
# Disable the proxy inside our containers so they use Docker DNS + direct routing.
x-noproxy: &noproxy
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  NO_PROXY: "*"
  no_proxy: "*"

services:
  siegclaw-bot:
    build: .
    # Host 8800 -> container 8080. (Host :8080 is taken by llama.cpp.)
    ports:
      - "8800:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      <<: *noproxy
      MEM0_API_URL: http://mem0:8000
    depends_on:
      - mem0
    # Only mount runtime data; app code comes from the image. Rebuild to change code.
    # soul.md is mounted so the web UI's soul edits persist and survive rebuilds
    # (it's not baked into the image).
    volumes:
      - ./soul.md:/app/soul.md
      - ./skills:/app/skills
      - ./data:/app/data
      - ./workspace:/app/workspace
    restart: unless-stopped

  # Featherweight embeddings (fastembed / ONNX Runtime — no torch, no GPU).
  embed:
    build: ./embed
    environment:
      <<: *noproxy
    restart: unless-stopped

  # Tiny custom mem0 service: extraction LLM -> llama.cpp, embedder -> fastembed,
  # vector store -> pgvector, no graph store. (See mem0svc/.)
  mem0:
    build: ./mem0svc
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *noproxy
      # Extraction LLM (OpenAI-compatible). Point at your llama.cpp.
      MEM0_LLM_BASE_URL: http://192.168.1.121:8080/v1
      MEM0_LLM_MODEL: "unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q4_K_XL"
      MEM0_LLM_API_KEY: not-needed
      # Embedder -> the fastembed service.
      MEM0_EMBED_BASE_URL: http://embed:8090/v1
      MEM0_EMBED_MODEL: nomic-embed-text
      MEM0_EMBED_DIMS: "768"
      # pgvector connection.
      POSTGRES_HOST: pgvector
      POSTGRES_PORT: "5432"
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: mem0
      POSTGRES_DB: mem0
    volumes:
      - ./data/mem0_history:/app/history
    depends_on:
      pgvector:
        condition: service_healthy
      embed:
        condition: service_started
    restart: unless-stopped

  # Vector store for mem0.
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: mem0
      POSTGRES_DB: mem0
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mem0", "-d", "mem0"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./data/pgvector:/var/lib/postgresql/data
    restart: unless-stopped
