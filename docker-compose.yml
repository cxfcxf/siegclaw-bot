services:
  siegclaw-bot:
    build: .
    # Host 8800 -> container 8080. (Host :8080 is taken by llama.cpp.)
    ports:
      - "8800:8080"
    # Let the container reach host services (llama.cpp, Ollama, ...) via
    # host.docker.internal on Linux/WSL2.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Load .env via compose (no bind mount = no inode-swap issues on save).
    env_file:
      - .env
    # Talk to the mem0 service over the compose network (overrides any
    # MEM0_API_URL in .env so the in-container hostname is correct).
    environment:
      - MEM0_API_URL=http://mem0:8888
    depends_on:
      - mem0
    # Only mount runtime data; app code (app/, web/, soul.md, mcp.json) comes
    # from the image. Rebuild to change code.
    volumes:
      - ./skills:/app/skills
      - ./data:/app/data
      - ./workspace:/app/workspace
    restart: unless-stopped

  # mem0 memory as its own service (keeps the bot image lean — no torch/chromadb).
  # The bot talks to it over HTTP at MEM0_API_URL. Configure the mem0 server's
  # extraction LLM to point at your llama.cpp and use a local embedder; see the
  # mem0 self-hosting docs for the exact config/env your image version expects.
  # NOTE: confirm the image name/tag and config against mem0's current docs.
  mem0:
    image: mem0/mem0-api-server:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Extraction LLM: reuse the llama.cpp server (OpenAI-compatible).
      - OPENAI_API_KEY=not-needed
      - OPENAI_BASE_URL=http://host.docker.internal:8080/v1
      # Embedder: keep local; adjust to your image's expected env keys.
    volumes:
      - ./data/mem0:/data
    restart: unless-stopped
