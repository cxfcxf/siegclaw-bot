services:
  siegclaw-bot:
    build: .
    # Host 8800 -> container 8080. (Host :8080 is taken by llama.cpp.)
    ports:
      - "8800:8080"
    # Let the container reach host services (llama.cpp, Ollama, ...) via
    # host.docker.internal on Linux/WSL2.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Load .env via compose (no bind mount = no inode-swap issues on save).
    env_file:
      - .env
    # When you enable the mem0 profile below, set MEM0_API_URL=http://mem0:8000
    # here (the server listens on 8000) and add `depends_on: [mem0]`.
    # Only mount runtime data; app code (app/, web/, soul.md, mcp.json) comes
    # from the image. Rebuild to change code.
    volumes:
      - ./skills:/app/skills
      - ./data:/app/data
      - ./workspace:/app/workspace
    restart: unless-stopped

  # mem0 memory as its own service. NOT started by default — `mem0/mem0-api-server`
  # listens on :8000 and defaults to a pgvector (Postgres) vector store, so it needs
  # a Postgres/pgvector companion AND an embeddings source (the default OpenAI
  # embedder must point at an endpoint that actually serves /v1/embeddings). Until
  # that's wired up, the bot falls back to the simple memory store.
  #
  # To bring it up:  docker compose --profile mem0 up -d
  # then set on the bot service: environment MEM0_API_URL=http://mem0:8000 + depends_on.
  mem0:
    image: mem0/mem0-api-server:latest
    profiles: ["mem0"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Extraction LLM: reuse the llama.cpp server (OpenAI-compatible).
      - OPENAI_API_KEY=not-needed
      - OPENAI_BASE_URL=http://192.168.1.121:8080/v1
      # pgvector connection (add a pgvector/pgvector service for these to work).
      - POSTGRES_HOST=pgvector
      - POSTGRES_PORT=5432
      - POSTGRES_USER=mem0
      - POSTGRES_PASSWORD=mem0
      - POSTGRES_DB=mem0
    volumes:
      - ./data/mem0:/data
    restart: unless-stopped
